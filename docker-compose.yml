services:
  flow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flow-workspace
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - FLOW_DB_PATH=/app/data/flow.sqlite
      # Optional: store data in PostgreSQL / Supabase instead of SQLite
      # - DATABASE_URL=postgresql://user:password@host:6543/postgres
